# Default training configuration (read by scripts/train_on_split.py --config).
# Values are the ones used for the results of Ref. [1]; command-line flags
# override them.

algorithm: PPO
# Network: separate actor/critic MLPs [256, 256] (fixed in scripts/train_on_split.py).
# Operating-condition noise at beta = 1 (std): speed 200 rpm, lambda 0.08,
# intake pressure 20 kPa, intake temperature 20 K (WiebeEnvV4.randomization_base).

hyperparameters:
  total_timesteps: 300000
  n_envs: 4
  learning_rate: 3.0e-4
  n_steps: 2048          # per environment
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  checkpoint_freq: 10000
  eval_freq: 5000

reward_weights:
  w_nrmse: 1.0           # pressure-trace NRMSE
  w_r2: 0.2              # coefficient of determination
  w_peakP: 0.5           # peak pressure outside [2, 200] bar
  w_ca50: 0.3            # |CA50 error|; active only if the case provides ca50_deg
  w_tb: 0.1              # peak temperature above 4000 K
  w_xb: 0.2              # burn completeness (target 0.98) and monotonicity

curriculum:
  mode: synced           # synced | legacy | fixed-final (see train_on_split.py)
  schedule_steps: [0, 100000, 200000]   # total environment steps
  spans: [0.50, 0.75, 1.00]             # alpha_k, action-bound expansion
  noise_scales: [0.30, 0.65, 1.00]      # beta_k, operating-condition noise
